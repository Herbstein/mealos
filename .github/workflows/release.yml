name: Release MealOS

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MEALOS_KEYSTORE_PASSWORD: ${{ secrets.MEALOS_KEYSTORE_PASSWORD }}
      MEALOS_KEY_ALIAS: ${{ secrets.MEALOS_KEY_ALIAS }}
      MEALOS_KEY_PASSWORD: ${{ secrets.MEALOS_KEY_PASSWORD }}

    steps:
      - name: Check out MealOS
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37"

      - name: Resolve release version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tags must look like v0.2.0"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( minor > 999 || patch > 999 )); then
            echo "Minor and patch versions must be 999 or lower"
            exit 1
          fi
          echo "MEALOS_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "MEALOS_VERSION_CODE=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_ENV"
          echo "MEALOS_KEYSTORE_PATH=$RUNNER_TEMP/mealos-release.jks" >> "$GITHUB_ENV"
          echo "MEALOS_RELEASE_APK=$RUNNER_TEMP/MealOS-${GITHUB_REF_NAME#v}.apk" >> "$GITHUB_ENV"

      - name: Restore release signing key
        env:
          MEALOS_KEYSTORE_BASE64: ${{ secrets.MEALOS_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$MEALOS_KEYSTORE_BASE64"
          test -n "$MEALOS_KEYSTORE_PASSWORD"
          test -n "$MEALOS_KEY_ALIAS"
          test -n "$MEALOS_KEY_PASSWORD"
          printf '%s' "$MEALOS_KEYSTORE_BASE64" | base64 --decode > "$MEALOS_KEYSTORE_PATH"

      - name: Test and build signed APK
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon --console=plain

      - name: Name release APK
        run: cp app/build/outputs/apk/release/app-release.apk "$MEALOS_RELEASE_APK"

      - name: Publish private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$MEALOS_RELEASE_APK" --verify-tag --generate-notes --title "MealOS $MEALOS_VERSION_NAME"
